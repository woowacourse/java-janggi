version: "3.9"
services:
  db:
    image: mysql:8.0.28
    platform: linux/x86_64
    restart: on-failure
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: janggi
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      TZ: Asia/Seoul
    volumes:
      - ./production/db/mysql/data:/var/lib/mysql
      - ./production/db/mysql/config:/etc/mysql/conf.d
      - ./production/db/mysql/init:/docker-entrypoint-initdb.d

  test_db:
    image: mysql:8.0.28
    platform: linux/x86_64
    restart: on-failure
    ports:
      - "23306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: janggi_test
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      TZ: Asia/Seoul
    volumes:
      - ./test/db/mysql/data:/var/lib/mysql
      - ./test/db/mysql/config:/etc/mysql/conf.d
      - ./test/db/mysql/init:/docker-entrypoint-initdb.d