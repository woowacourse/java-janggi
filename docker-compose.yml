services:
  mysql:
    image: mysql:8.4
    container_name: janggi-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: JANGGI
      MYSQL_USER: janggi
      MYSQL_PASSWORD: janggi1234
      MYSQL_ROOT_PASSWORD: root1234
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build:
      context: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      JANGGI_DB_URL: jdbc:mysql://mysql:3306/JANGGI?serverTimezone=Asia/Seoul
      JANGGI_DB_USER: janggi
      JANGGI_DB_PASSWORD: janggi1234
    stdin_open: true
    tty: true

volumes:
  mysql-data:
