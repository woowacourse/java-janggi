services:
  mysql:
    image: mysql:8.0
    container_name: janggi-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: janggi
      MYSQL_USER: janggi-user
      MYSQL_PASSWORD: password
      TZ: Asia/Seoul
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./data.sql:/docker-entrypoint-initdb.d/02-data.sql
    restart: always
  mysql-test:
    image: mysql:8.0
    container_name: janggi-mysql-test
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: janggi_test
      MYSQL_USER: janggi-user
      MYSQL_PASSWORD: password
      TZ: Asia/Seoul
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always