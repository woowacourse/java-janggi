version: "3.9"
services:
  db:
    image: mysql:8.0.28
    platform: linux/x86_64
    restart: always
    ports:
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATEBASE: janggi
      MYSQL_USER: moru
      MYSQL_PASSWORD: Choi8921!
      TZ: Asia/Seoul
    volumes:
    - ./db/mysql/janggi/data:/var/lib/mysql
    - ./db/mysql/janggi/config:/etc/mysql/conf.d
    - ./db/mysql/janggi/init:/docker-entrypoint-initdb.d
